# Liquidations: every lending liquidation on Ethereum mainnet since 2023-01-01.
# Aave v3 (Core, Prime, EtherFi), Spark, Compound v3, Morpho Blue, Sky/Maker and Liquity,
# with Chainlink ETH/USD and BTC/USD to price them. Event-only ABIs, written by hand.

[nest]
name = "liquidations"
chain = "mainnet"
chain_id = 1
rpc_urls = ["https://gateway.tenderly.co/public/mainnet"]   # a keyed endpoint goes on the command line: --rpc
schema_version = 1
block_timestamps = true

